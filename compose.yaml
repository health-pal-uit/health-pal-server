services:
  health-pal-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '5433:5432'
    volumes:
      - health-pal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  health-pal-redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - health-pal-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  health-pal-prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - health-pal-prometheus-data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  health-pal-loki:
    image: grafana/loki:3.0.0
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - health-pal-loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  health-pal-promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - health-pal-loki
    restart: unless-stopped

  health-pal-grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - health-pal-grafana-data:/var/lib/grafana
    depends_on:
      - health-pal-prometheus
      - health-pal-loki
    restart: unless-stopped

  health-pal-server:
    build:
      context: .
    environment:
      NODE_ENV: production
      DB_HOST: health-pal-db
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: health-pal-redis
      REDIS_PORT: 6379
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      AVATAR_BUCKET_NAME: ${AVATAR_BUCKET_NAME}
      POST_IMG_BUCKET_NAME: ${POST_IMG_BUCKET_NAME}
      POST_VIDEO_BUCKET_NAME: ${POST_VIDEO_BUCKET_NAME}
      CHAT_IMG_BUCKET_NAME: ${CHAT_IMG_BUCKET_NAME}
      CHALLENGE_IMG_BUCKET_NAME: ${CHALLENGE_IMG_BUCKET_NAME}
      MEDAL_IMG_BUCKET_NAME: ${MEDAL_IMG_BUCKET_NAME}
      MEAL_IMG_BUCKET_NAME: ${MEAL_IMG_BUCKET_NAME}
      INGREDIENT_IMG_BUCKET_NAME: ${INGREDIENT_IMG_BUCKET_NAME}
      PROJECT_ID: ${PROJECT_ID}
      PRIVATE_KEY: ${PRIVATE_KEY}
      CLIENT_EMAIL: ${CLIENT_EMAIL}
      GOOGLE_FIT_CALLBACK_URL: ${GOOGLE_FIT_CALLBACK_URL}
    ports:
      - '3001:3001'
    depends_on:
      health-pal-db:
        condition: service_healthy
      health-pal-redis:
        condition: service_healthy

volumes:
  health-pal-db-data:
  health-pal-redis-data:
  health-pal-prometheus-data:
  health-pal-loki-data:
  health-pal-grafana-data:
