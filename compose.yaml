# Start the configured backend, AI and monitoring with: docker compose up -d
# DB_TARGET/CLOUD_DB_* are read from the existing private .env at runtime.
x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  health-pal-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - health-pal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *service-logging
    restart: unless-stopped

  healthpal-ai:
    build:
      context: ${HEALTHPAL_AI_SOURCE:-../healthpal-ai-service}
      dockerfile: ${HEALTHPAL_AI_DOCKERFILE:-../health-pal-server/docker/ai.Dockerfile}
    environment:
      HEALTHPAL_DEVICE: cpu
      HEALTHPAL_MODEL_PATH: /app/models/healthpal-selected-92.pt
      YOLO_CONFIG_DIR: /tmp/ultralytics
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - type: bind
        source: ${HEALTHPAL_MODEL_FILE:-../healthpal-ai-service/models/healthpal-selected-92.pt}
        target: /app/models/healthpal-selected-92.pt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:8001:8001'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/health/ready", timeout=4).close()',
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
    logging: *service-logging
    restart: unless-stopped

  health-pal-server:
    build:
      context: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_TARGET: ${DB_TARGET:-local}
      DB_HOST: health-pal-db
      DB_PORT: 5432
      HEALTHPAL_AI_BASE_URL: http://healthpal-ai:8001
      HEALTHPAL_AI_TIMEOUT_MS: ${HEALTHPAL_AI_TIMEOUT_MS:-10000}
      # Optional legacy /analyze service continues to run separately on the host.
      FOOD_VISION_URL: ${FOOD_VISION_CONTAINER_URL:-http://host.docker.internal:5000/analyze}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      healthpal.logs: recognition
    ports:
      - '3001:3001'
    depends_on:
      health-pal-db:
        condition: service_healthy
      healthpal-ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3001/api-json").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 12
    logging: *service-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - recognition-loki-data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging: *service-logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config
    environment:
      HEALTHPAL_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-health-pal-server}
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ./monitoring/config.docker.alloy:/etc/alloy/config/source.alloy:ro
      - ./monitoring/recognition-pipeline.alloy:/etc/alloy/config/pipeline.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - recognition-alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    logging: *service-logging
    restart: unless-stopped

  grafana-init:
    image: busybox:1.37.0
    entrypoint: ['/bin/sh', '/opt/healthpal/init-grafana-secret.sh']
    volumes:
      - ./docker/init-grafana-secret.sh:/opt/healthpal/init-grafana-secret.sh:ro
      - ./monitoring:/existing-monitoring:ro
      - recognition-secrets:/run/healthpal-secrets
    read_only: true
    logging: *service-logging
    restart: 'no'

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: healthpaladmin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/healthpal-secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - recognition-grafana-data:/var/lib/grafana
      - recognition-secrets:/run/healthpal-secrets:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      grafana-init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging: *service-logging
    restart: unless-stopped

volumes:
  health-pal-db-data:
  recognition-loki-data:
  recognition-alloy-data:
  recognition-grafana-data:
  recognition-secrets:
