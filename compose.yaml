services:
  health-pal-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '5433:5432'
    volumes:
      - health-pal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  health-pal-server:
    build:
      context: .
    environment:
      NODE_ENV: production
      DB_HOST: health-pal-db
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      AVATAR_BUCKET_NAME: ${AVATAR_BUCKET_NAME}
      POST_IMG_BUCKET_NAME: ${POST_IMG_BUCKET_NAME}
      POST_VIDEO_BUCKET_NAME: ${POST_VIDEO_BUCKET_NAME}
      CHAT_IMG_BUCKET_NAME: ${CHAT_IMG_BUCKET_NAME}
      CHALLENGE_IMG_BUCKET_NAME: ${CHALLENGE_IMG_BUCKET_NAME}
      MEDAL_IMG_BUCKET_NAME: ${MEDAL_IMG_BUCKET_NAME}
      MEAL_IMG_BUCKET_NAME: ${MEAL_IMG_BUCKET_NAME}
      INGREDIENT_IMG_BUCKET_NAME: ${INGREDIENT_IMG_BUCKET_NAME}
      PROJECT_ID: ${PROJECT_ID}
      PRIVATE_KEY: ${PRIVATE_KEY}
      CLIENT_EMAIL: ${CLIENT_EMAIL}
      GOOGLE_FIT_CALLBACK_URL: ${GOOGLE_FIT_CALLBACK_URL}
      ALCHEMY_RPC_URL: ${ALCHEMY_RPC_URL}
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FOOD_VISION_URL: ${FOOD_VISION_URL}
      LICENSES_BUCKET_NAME: ${LICENSES_BUCKET_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - '3001:3001'
    depends_on:
      health-pal-db:
        condition: service_healthy

  loki:
    image: grafana/loki:3.0.0
    ports:
      - '3100:3100'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 -O- http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '3000:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  health-pal-db-data:
  loki-data:
  grafana-data:
