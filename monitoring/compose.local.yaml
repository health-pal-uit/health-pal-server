name: healthpal-monitoring

# For the existing Windows-hosted backend. No application/database containers.
services:
  loki:
    image: grafana/loki:3.0.0
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - local-loki-data:/loki

  alloy:
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config
    ports:
      - '127.0.0.1:12345:12345'
    volumes:
      - ./config.alloy:/etc/alloy/config/source.alloy:ro
      - ./recognition-pipeline.alloy:/etc/alloy/config/pipeline.alloy:ro
      - ${HP_BACKEND_LOG_DIR:-../../.cache/recognition-performance-20261122}/backend.stdout.log:/var/log/healthpal/backend.stdout.log:ro
      - ${HP_BACKEND_LOG_DIR:-../../.cache/recognition-performance-20261122}/backend.stderr.log:/var/log/healthpal/backend.stderr.log:ro
      - local-alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: healthpaladmin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    secrets:
      - grafana_admin_password
    volumes:
      - local-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - loki

secrets:
  grafana_admin_password:
    file: ./.grafana-admin-password.local

volumes:
  local-loki-data:
  local-alloy-data:
  local-grafana-data:
